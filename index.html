<script>
        let map;
        let geocoder;

        function initMap() {
            // Coordenadas centrais de Barretos, SP
            const barretos = { lat: -20.5588, lng: -48.5694 };

            // Inicializa o mapa
            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 14,
                center: barretos,
            });

            // Inicializa o serviço de Geocoding (conversor de endereço)
            geocoder = new google.maps.Geocoder();

            // Marcador inicial fixo no centro
            new google.maps.Marker({
                position: barretos,
                map: map,
                title: "Centro de Barretos",
            });

            // Evento de clique no botão "Adicionar ao Mapa"
            document.getElementById("addPoint").addEventListener("click", function() {
                const name = document.getElementById("localName").value;
                const address = document.getElementById("localAddress").value;

                if (!address) {
                    alert("Por favor, digite um endereço!");
                    return;
                }

                geocodeAddress(geocoder, map, name, address);
            });
        }

        // Função que converte o endereço digitado em coordenadas geográficas
        function geocodeAddress(geocoder, resultsMap, name, address) {
            // Adiciona "Barretos - SP" para garantir precisão na busca local
            const fullAddress = address + ", Barretos - SP";

            geocoder.geocode({ address: fullAddress }, (results, status) => {
                if (status === "OK") {
                    // Centraliza o mapa no endereço encontrado
                    resultsMap.setCenter(results[0].geometry.location);
                    resultsMap.setZoom(16);

                    // Cria um novo marcador no mapa
                    const marker = new google.maps.Marker({
                        map: resultsMap,
                        position: results[0].geometry.location,
                        title: name || address,
                    });

                    // Cria um balão de informação (InfoWindo) com o nome do local
                    const infowindow = new google.maps.InfoWindow({
                        content: `<div><strong>${name || "Local"}</strong><br>${address}</div>`
                    });

                    marker.addListener("click", () => {
                        infowindow.open(resultsMap, marker);
                    });

                    // Abre o balão automaticamente ao adicionar
                    infowindow.open(resultsMap, marker);

                    // Limpa os campos após adicionar
                    document.getElementById("localName").value = "";
                    document.getElementById("localAddress").value = "";

                } else {
                    alert("Não foi possível encontrar o endereço. Tente especificar melhor (ex: Rua 20, 1000). Status do erro: " + status);
                }
            });
        }
    </script>
